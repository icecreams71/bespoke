
name: Test Spanish Curriculum

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check Spanish language
        run: |
          uv run create.py --help

      - name: Validate Spanish curriculum
        run: |
          uv run python - <<'PY'
          from bespoke import languages

          spanish = next(
              (lang for lang in languages.LANGUAGES.values()
               if lang.writing_system == "Spanish"),
              None
          )
          assert spanish is not None, "Spanish not registered"
          assert spanish.has_data(), "Spanish curriculum not recognised"
          grammar = languages.load_grammar(spanish.code_name)
          print("Spanish recognised successfully")
          print("Grammar loaded:", bool(grammar))
          PY
